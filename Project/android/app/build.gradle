plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingDirectoryPath = System.getenv('WISEMESSAGE_SIGNING_DIR')
def signingDirectory = signingDirectoryPath ? new File(signingDirectoryPath).canonicalFile : null
if (signingDirectory && !new File(signingDirectoryPath).isAbsolute()) {
    throw new GradleException('WISEMESSAGE_SIGNING_DIR must be an absolute path.')
}
if (signingDirectory && signingDirectory.toPath().startsWith(rootProject.projectDir.parentFile.parentFile.canonicalFile.toPath())) {
    throw new GradleException('Keep signing files outside the submission folder.')
}
def signingPropertiesFile = signingDirectory ? new File(signingDirectory, 'test-signing.properties') : null
def signingKeyFile = signingDirectory ? new File(signingDirectory, 'wisemessage-test.jks') : null
if (signingDirectory && (!signingPropertiesFile.isFile() || !signingKeyFile.isFile())) {
    throw new GradleException('The existing private signing key and matching properties are required.')
}
if (signingDirectory) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'hk.wisemessage.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    def localNdk = System.getenv('WISEMESSAGE_NDK')
    if (localNdk) { ndkPath localNdk }

    defaultConfig {
        applicationId 'hk.wisemessage.app'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '3.2.0-test'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'hk.wisemessage.app.AppFlowInstrumentation'
    }

    signingConfigs {
        localTest {
            if (signingDirectory) {
                storeFile signingKeyFile
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.localTest
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt'] }
    }

    androidResources { noCompress += ['ms', 'mindir', 'bin', 'json', 'txt'] }
    // Every language must remain available offline if a local bundle is built later.
    bundle { language { enableSplit = false } }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
